<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudar com AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="ferramenta/pagina.css">
</head>
<body>
  <main>
    <header class="topo coluna">
      <div class="etiquetas"><span class="etiqueta">Estudar com AI</span></div>
      <h1>Minhas aulas</h1>
      <p class="objetivo">Cada aula é uma página com explicação, exemplos resolvidos, diagramas e testes rápidos. Para começar uma nova, digite <code>/aula</code> e o tema no Claude Code.</p>
    </header>
    <div class="lista-aulas coluna" id="lista"></div>
  </main>
  <script>
    (function () {
      var itens = [];
      window.lista = function (d) { itens.push(d); };
      var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
      var modos = { direito: "Direito", curiosidade: "Curiosidade", faculdade: "Faculdade" };
      function mostrar() {
        var alvo = document.getElementById("lista");
        if (!itens.length) { alvo.innerHTML = '<p class="vazio">Nenhuma aula ainda.</p>'; return; }
        itens.sort(function (a, b) { return String(b.data).localeCompare(String(a.data)); });
        alvo.innerHTML = itens.map(function (d) {
          return '<a class="item-aula" href="aulas/' + encodeURIComponent(d.pasta) + '/index.html"><div class="cartao">' +
            '<div class="data">' + esc(d.data) + (d.modo ? " · " + esc(modos[d.modo] || d.modo) : "") + '</div>' +
            '<h3>' + esc(d.tema) + '</h3>' + (d.resumo ? '<p>' + esc(d.resumo) + '</p>' : '') + '</div></a>';
        }).join("");
      }
      var s = document.createElement("script");
      s.src = "aulas/lista.js?t=" + Date.now();
      s.onload = mostrar; s.onerror = mostrar;
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
